<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Account</title>
    <link rel="stylesheet" th:href="@{/webjars/github-com-twbs-bootstrap-/5.3.8/css/bootstrap.min.css}"/>
</head>
<body class="container mt-5">

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">Edit Account</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/accounts/save}" th:object="${account}" method="post">
                    <div class="mb-3">
                        <label for="accountNumber" class="form-label">Account Number</label>
                        <input type="text" class="form-control" id="accountNumber" th:field="*{accountNumber}" readonly>
                        <small class="text-muted">Account numbers cannot be changed.</small>
                    </div>
                    <div class="mb-3">
                        <label for="emailAddress" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="emailAddress" th:field="*{emailAddress}">
                    </div>
                    <div class="mb-3">
                        <label for="phoneNumber" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phoneNumber" th:field="*{phoneNumber}">
                    </div>
                    <div class="mb-3">
                        <label for="mailingAddress" class="form-label">Mailing Address</label>
                        <input type="text" class="form-control" id="mailingAddress" th:field="*{mailingAddress}">
                    </div>
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/accounts}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update Account</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
