<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Accommodation Management - Accounts</title>
    <link rel="stylesheet" th:href="@{/webjars/github-com-twbs-bootstrap-/5.3.8/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/Site.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/datatables/2.3.7/css/dataTables.bootstrap5.min.css}"/>
</head>
<body class="container mt-5">

<h2 class="mb-4">Managed Accounts</h2>
<hr>

<table id="accountsTable" class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>Account Number</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Total Reservations</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="account : ${accounts}">
        <td th:text="${account.accountNumber}">A123456789</td>
        <td th:text="${account.emailAddress}">test@example.com</td>
        <td th:text="${account.phoneNumber}">555-1234</td>
       <td th:text="${account.reservations.size()}">2</td>
        <td>
            <a th:href="@{/accounts/reservations/{accountNumber}(accountNumber=${account.accountNumber})}" class="btn btn-sm btn-primary">View Details</a>
        </td>
    </tr>
    </tbody>
</table>
<script type="text/javascript" th:src="@{/webjars/jquery/4.0.0/dist/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/github-com-twbs-bootstrap-/5.3.8/js/bootstrap.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/datatables/2.3.7/js/dataTables.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/datatables/2.3.7/js/dataTables.bootstrap5.min.js}"></script>

<script>
    $(document).ready(function() {
        $('#accountsTable').DataTable({
            "pageLength": 10,
            "ordering": true
        });
    });
</script>
</body>
</html>
