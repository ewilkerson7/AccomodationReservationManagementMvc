<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Reservation</title>
    <link rel="stylesheet" th:href="@{/webjars/github-com-twbs-bootstrap-/5.3.8/css/bootstrap.min.css}"/>
</head>
<body class="container mt-5">

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Add New Reservation for Account: <span th:text="${accountNumber}"></span></h4>
            </div>
            <div class="card-body">
                <form th:action="@{/reservations/save}" th:object="${reservation}" method="post">

                    <!-- Hidden field to pass the account number seamlessly -->
                    <input type="hidden" name="accountNumber" th:value="${accountNumber}" />

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Reservation Number (10 chars)</label>
                            <input type="text" class="form-control" th:field="*{reservationNumber}" required maxlength="10">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" class="form-control" th:field="*{startDate}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Number of Nights</label>
                            <input type="number" class="form-control" th:field="*{numberOfNights}" min="1" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Lodging Size (SqFt)</label>
                            <input type="number" class="form-control" th:field="*{lodgingSizeSqFt}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Beds</label>
                            <input type="number" class="form-control" th:field="*{numberOfBeds}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Bedrooms</label>
                            <input type="number" class="form-control" th:field="*{numberOfBedrooms}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Bathrooms</label>
                            <input type="number" class="form-control" th:field="*{numberOfBathrooms}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Physical Address</label>
                        <input type="text" class="form-control" th:field="*{physicalAddress}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mailing Address</label>
                        <input type="text" class="form-control" th:field="*{mailingAddress}">
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/accounts/reservations/{accountNumber}(accountNumber=${accountNumber})}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Save Reservation</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
